name: Trigger Code Assets
on:
  release:
    types: [published, unpublished, created, edited, deleted, prereleased, released]
jobs:
  trigger-update:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Code Assets
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.TOKEN }}
          repository: LILCMU/gogo-code-assets
          event-type: fetch-whats-new
